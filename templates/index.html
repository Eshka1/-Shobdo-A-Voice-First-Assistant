{% extends "base.html" %}

{% block title %}Home - Shobdo{% endblock %}

{% block content %}
<div class="container text-center mt-4">
    <div class="btn-group lang-switch" role="group" aria-label="Choose language" data-i18n-aria="langGroup">
        <input type="radio" class="btn-check" name="language" id="lang-en" value="en" checked>
        <label class="btn lang-btn" for="lang-en">English</label>

        <input type="radio" class="btn-check" name="language" id="lang-bn" value="bn">
        <label class="btn lang-btn" for="lang-bn" lang="bn">বাংলা</label>
    </div>
</div>

<div class="container text-center mt-4">
    <div class="neu-card mx-auto">
        <p class="fs-4" data-i18n="welcome">Welcome! Press the button to talk to Shobdo.</p>
        <button type="button" id="mic-btn" class="mic-button" aria-label="Start speaking"
            data-i18n-aria="micLabel">🎤<br><span data-i18n="mic">Speak</span></button>
        <p id="status" class="mt-3 fs-5" role="status" aria-live="polite"></p>
        <div class="d-flex gap-2 flex-wrap mt-3 speech-controls">
            <button type="button" id="repeat-btn" class="btn action-btn" data-i18n="repeat">Repeat</button>
            <button type="button" id="slow-btn" class="btn action-btn" aria-pressed="false">Slower</button>
            <button type="button" id="stop-btn" class="btn action-btn action-cancel" data-i18n="stop">Stop</button>
        </div>

        <form id="command-form" class="mt-4" autocomplete="off">
            <label for="command-input" class="form-label fs-5" data-i18n="typeLabel">Or type your request</label>
            <div class="d-flex gap-2">
                <input type="text" id="command-input" class="form-control command-input"
                    placeholder="Remind me to take medicine at 9 PM" data-i18n-placeholder="placeholder"
                    maxlength="200">
                <button type="submit" class="btn action-btn send-btn" data-i18n="send">Send</button>
            </div>
        </form>
    </div>
</div>

<section class="container mt-5 mb-5" aria-labelledby="reminders-heading">
    <h2 id="reminders-heading" class="text-center h3 mb-4" data-i18n="remindersTitle">My reminders</h2>
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            {% for r in reminders %}
            <div class="neu-card reminder-card mb-4">
                <div class="reminder-task" data-text-en="{{ r.task_en }}" data-text-bn="{{ r.task_bn }}">{{ r.task_en }}
                </div>
                <div class="reminder-time" data-text-en="{{ r.time_en }}" data-text-bn="{{ r.time_bn }}">{{ r.time_en }}
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="button" class="btn action-btn" data-i18n="done">Done</button>
                    <button type="button" class="btn action-btn action-cancel" data-i18n="cancel">Cancel</button>
                </div>
            </div>
            {% else %}
            <p class="text-center fs-5" data-i18n="noReminders">No reminders yet.</p>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
